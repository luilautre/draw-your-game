<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>Draw Your Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111827;color:white;font-family:system-ui,sans-serif;overscroll-behavior:none}body{display:flex;flex-direction:column;overflow:hidden}#game-ui{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:#1f2937;flex:0 0 auto}button,label{font:inherit}button{border:0;border-radius:10px;padding:8px 12px;color:#fff;background:#374151;touch-action:manipulation}button.active{outline:2px solid white}input{max-width:110px}#stage{flex:1 1 auto;min-height:100px;display:block;width:100%;touch-action:none;background:#f8fafc;overscroll-behavior:none}#hint{font-size:12px;color:#cbd5e1;padding:0 6px}#debug{flex:0 0 auto;max-height:23vh;overflow:auto;background:#030712;color:#a7f3d0;font:12px monospace;padding:6px;border-top:1px solid #475569;white-space:pre-wrap;word-break:break-word}#debug summary{color:#fbbf24;cursor:pointer}#debuglog{margin-top:5px}
</style></head><body>
<div id="game-ui"><button data-color="#222222" class="active">Noir</button><button data-color="#1685ff">Bleu</button><button data-color="#ef4444">Rouge</button><button data-color="#22c55e">Vert</button><button id="eraser">Gomme</button><label>Épaisseur <input id="width" type="range" min="2" max="40" value="12"></label><button id="mode">Jouer</button><button id="clear">Effacer</button><button id="save">Exporter</button><button id="load">Importer</button><input id="file" type="file" accept=".dphys,.json" hidden><span id="hint">Dessine en mode édition. Noir = mur, bleu = objets, rouge = danger, vert = rebond.</span></div>
<canvas id="stage"></canvas><details id="debug" open><summary>Console JavaScript (debug mobile)</summary><div id="debuglog">Console prête.</div></details><script src="game.js"></script></body></html>
