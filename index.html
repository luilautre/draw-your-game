<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Draw Your Game</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111827;color:white;font-family:system-ui;overflow:hidden}body{display:flex;flex-direction:column}#game-ui{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:#1f2937;align-items:center}button{border:0;border-radius:9px;padding:10px;background:#374151;color:white;font-size:16px;touch-action:manipulation}button.active{outline:2px solid white}#stage{width:100%;flex:1;min-height:0;display:block;background:#f8fafc;touch-action:none}#controls{display:flex;justify-content:center;gap:18px;padding:8px;background:#111827}#controls button{font-size:24px;min-width:72px;min-height:56px;user-select:none}#debug{max-height:14vh;overflow:auto;background:#030712;color:#a7f3d0;font:11px monospace;padding:4px}</style></head><body><div id="game-ui"><button data-color="#222222" class="active">Noir</button><button data-color="#1685ff">Bleu</button><button data-color="#ef4444">Rouge</button><button data-color="#22c55e">Vert</button><button id="eraser">Gomme</button><label>Épaisseur <input id="width" type="range" min="2" max="40" value="12"></label><button id="mode">Jouer</button><button id="clear">Effacer</button><button id="save">Exporter</button><button id="load">Importer</button><input id="file" type="file" accept=".dphys,.json" hidden></div><canvas id="stage"></canvas><div id="controls"><button id="left">◀</button><button id="jump">▲ Saut</button><button id="right">▶</button></div><details id="debug" open><summary>Console JS (debug)</summary><div id="debuglog"></div></details><script src="game.js"></script></body></html>
