<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111827">
  <title>Draw Your Game</title>
  <style>html,body{margin:0;height:100%;background:#111827;color:#fff;font-family:system-ui,sans-serif}body{display:flex;flex-direction:column}#game-ui{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:#1f2937}button,label{font:inherit}button{border:0;border-radius:10px;padding:8px 12px;color:#fff;background:#374151}button.active{outline:2px solid white}input{max-width:110px}#stage{flex:1;min-height:0;display:block;width:100%;touch-action:none;background:#f8fafc}#hint{font-size:12px;color:#cbd5e1;padding:0 6px}</style>
</head>
<body>
<div id="game-ui">
<button data-color="#222222" class="active">Noir</button><button data-color="#1685ff">Bleu</button><button data-color="#ef4444">Rouge</button><button data-color="#22c55e">Vert</button>
<button id="eraser">Gomme</button><label>Épaisseur <input id="width" type="range" min="2" max="40" value="12"></label>
<button id="mode">Jouer</button><button id="clear">Effacer</button><button id="save">Exporter</button><button id="load">Importer</button><input id="file" type="file" accept=".dphys,.json" hidden>
<span id="hint">Dessine en mode édition. Noir = mur, bleu = objets, rouge = danger, vert = rebond.</span>
</div>
<canvas id="stage"></canvas>
<script src="game.js"></script>
</body></html>
